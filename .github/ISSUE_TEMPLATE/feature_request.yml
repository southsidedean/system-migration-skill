name: An idea
description: Something the skill could do, or do better
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "**Issues are public.** Please leave out anything private."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or the problem, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
